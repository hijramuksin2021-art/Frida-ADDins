<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRIDA</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo-text">
      <h1 class="app-title">FRIDA</h1>
      <p class="app-subtitle">Female Replacement Intelligent Digital Assistant</p>
    </div>
  </header>

  <!-- STATS BAR -->
  <div id="statsBar" class="stats-bar">
    <div class="stat-item"><span class="stat-icon">📝</span> <span id="statWords" class="stat-val">—</span> kata</div>
    <div class="stat-item"><span class="stat-icon">📄</span> <span id="statParagraphs" class="stat-val">—</span> paragraf</div>
    <div class="stat-item"><span class="stat-icon">🔤</span> <span id="statChars" class="stat-val">—</span> karakter</div>
    <div class="stat-item"><span class="stat-icon">⏱️</span> <span id="statReadTime" class="stat-val">—</span></div>
    <button id="statsRefresh" class="stats-toggle" title="Refresh statistik">🔄</button>
  </div>

  <nav class="app-nav">
    <button class="nav-tab active" data-tab="chat">💬 Chat</button>
    <button class="nav-tab" data-tab="sources">📚 Referensi</button>
    <button class="nav-tab" data-tab="settings">⚙ Pengaturan</button>
  </nav>

  <main class="app-main">
    <!-- CHAT TAB -->
    <div id="tab-chat" class="tab-content active">
      <div id="log" class="chat-log"></div>
      <div id="status" class="status"></div>
      <button id="undo" class="undo" style="display:none">↩️ Undo perubahan terakhir</button>
      <div id="audit" class="audit"></div>
      <!-- QUICK PROMPTS -->
      <div class="quick-prompts-wrapper" id="qpWrapper">
        <button class="qp-nav qp-nav-left" id="qpNavLeft" aria-label="Geser kiri">❮</button>
        <div id="quickPrompts" class="quick-prompts"></div>
        <button class="qp-nav qp-nav-right" id="qpNavRight" aria-label="Geser kanan">❯</button>
      </div>

      <!-- SELECTION CONTEXT -->
      <div id="selectionContext" class="selection-context hidden">
        <div class="sel-header">
          <span class="sel-title">Teks Terpilih:</span>
          <span id="selPreview" class="sel-preview">...</span>
        </div>
        <div class="sel-actions">
          <button class="sel-btn" data-action="Ganti teks yang sedang saya seleksi dengan versi parafrase-nya agar lebih mengalir secara akademis. Terapkan langsung perubahannya ke dokumen, jangan hanya menjawab di chat.">✨ Parafrase</button>
          <button class="sel-btn" data-action="Ganti teks yang sedang saya seleksi dengan versi ringkasnya dalam bentuk poin-poin penting. Terapkan langsung perubahannya ke dokumen, jangan hanya menjawab di chat.">📝 Ringkas</button>
          <button class="sel-btn" data-action="Perbaiki ejaan, salah ketik, dan tata bahasa pada teks yang sedang saya seleksi.">✅ Perbaiki Ejaan</button>
        </div>
      </div>

      <!-- TABLE SELECTION CONTEXT -->
      <div id="tableSelectionContext" class="selection-context hidden">
        <div class="sel-header">
          <span class="sel-title">Tabel Terpilih</span>
        </div>
        <div class="sel-actions">
          <button class="sel-btn" data-action="Ubah gaya border tabel yang sedang saya seleksi menjadi gaya tabel jurnal ilmiah/akademik (garis atas, garis bawah header, garis bawah tabel saja, tanpa garis vertikal).">📊 Gaya Akademik</button>
          <button class="sel-btn" data-action="Beri garis di semua sel pada tabel yang sedang saya seleksi (border all).">🔲 Semua Garis</button>
          <button class="sel-btn" data-action="Hapus semua garis pada tabel yang sedang saya seleksi.">⬜ Hapus Semua Garis</button>
          <button class="sel-btn" data-action="Tebalkan baris header (baris pertama) pada tabel yang sedang saya seleksi.">🔠 Header Tebal</button>
        </div>
      </div>

      <div class="composer">
        <div class="composer-input">
          <textarea id="instruction" rows="1" placeholder="Tulis perintah untuk FRIDA…"></textarea>
          <button id="clearChat" class="clear-chat-btn" title="Bersihkan chat">🗑️</button>
          <button id="send" class="send-btn" title="Kirim (Enter)">Kirim</button>
        </div>
        <label class="check" title="Tinjau dampak sebelum menerapkan">
          <input type="checkbox" id="previewToggle" checked /> Tinjau
        </label>
      </div>
    </div>

    <!-- REFERENCES TAB -->
    <div id="tab-sources" class="tab-content">
      <div class="section-header">
        <h2 class="section-title">📚 Referensi</h2>
        <button id="srcReindex" class="src-reindex">🔄 Indeks Ulang</button>
      </div>
      <div id="srcDrop" class="src-drop">
        Klik atau seret file ke sini<br/><small>PDF, DOCX, TXT (maks 25MB)</small>
        <input type="file" id="srcFile" accept=".pdf,.docx,.txt" multiple hidden />
      </div>
      <div id="srcStatus" class="src-status"></div>
      <div class="src-list-header">
        <h3>Daftar Dokumen <span id="srcCount" class="src-count"></span></h3>
      </div>
      <div id="srcList" class="src-list"></div>
      <div id="srcEmbed" class="src-embed"></div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="tab-content">
      <div class="section-header">
        <h2 class="section-title">⚙ Pengaturan</h2>
      </div>

      <!-- DARK MODE -->
      <div class="settings-card">
        <h3 class="settings-card-title">🎨 Tampilan</h3>
        <div class="dark-mode-row">
          <span>🌙 Mode Gelap</span>
          <label class="toggle-switch">
            <input type="checkbox" id="darkModeToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>


      <!-- GUIDELINE CONFIG -->
      <div class="settings-card">
        <h3 class="settings-card-title">📖 Panduan Penulisan</h3>
        <div class="provider-form">
          <label>
            Profil Fakultas / Institusi
            <div style="display:flex; gap:5px;">
              <select id="guidelineSelect" style="flex:1;">
                <option value="">-- Tidak ada / Generik --</option>
              </select>
              <button id="btnDeleteGuideline" class="icon-btn" title="Hapus Panduan" style="padding:4px 8px;">🗑️</button>
            </div>
          </label>
          <div id="activeGuidelineDesc" class="provider-hint" style="margin-top:4px;"></div>
          
          <div style="margin-top:10px; border-top: 1px dashed var(--border); padding-top:10px;">
            <label style="margin-bottom:4px; font-size:0.85em; opacity:0.8;">Upload Pedoman Baru (.json)</label>
            <input type="text" id="guidelineDisplayName" placeholder="Nama pedoman (untuk ditampilkan)" style="width:100%; margin-bottom:6px; padding:4px 8px; font-size:12px; box-sizing:border-box;" />
            <div style="display:flex; gap:5px;">
              <input type="file" id="guidelineFileInput" accept=".json" style="flex:1; font-size:11px;" />
              <button id="btnUploadGuideline" class="btn-primary" style="padding:4px 10px; font-size:12px;">Upload</button>
            </div>
          </div>
        </div>
      </div>

      <!-- AI PROVIDER -->
      <div class="settings-card">
        <h3 class="settings-card-title">🤖 AI Provider</h3>
        <div class="provider-form">
          <label>
            AI Provider
            <select id="providerSelect">
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI</option>
              <option value="gemini">Google Gemini</option>
              <option value="custom">Custom (OpenAI-compatible / 9Router / Aerolink)</option>
            </select>
          </label>
          <label id="providerBaseUrlLabel" style="display:none">
            Base URL
            <input type="text" id="providerBaseUrl" placeholder="http://localhost:20128/v1/" />
          </label>
          <label>
            API Key
            <input type="password" id="providerApiKey" placeholder="masukkan API key…" />
            <span id="providerKeyHint" class="provider-hint"></span>
          </label>
          <label id="providerModelLabel">
            Model
            <select id="providerModel">
              <option value="">-- Pilih model --</option>
            </select>
          </label>
          <button id="providerTest" class="provider-test">🔌 Tes Koneksi</button>
          <div id="providerStatus" class="provider-status"></div>
          <button id="providerSave" class="provider-save">💾 Simpan Pengaturan</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Registry tool + lapisan keselamatan -->
  <script src="tools/schemas.js"></script>
  <script src="tools/handlers.js"></script>
  <script src="tools/safety.js"></script>
  <script src="taskpane.js"></script>
  <script src="sources-ui.js"></script>
  <script src="provider-ui.js"></script>
  <script src="guideline-ui.js"></script>
</body>
</html>
